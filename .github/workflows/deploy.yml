name: Auto Deploy to Render

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Trigger Render Deploy Hook
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Trigger Render Deploy Hook for LibreChat
        if: ${{ secrets.RENDER_LIBRECHAT_DEPLOY_HOOK != '' }}
        run: |
          echo "🚀 Triggering LibreChat Render Deploy Hook..."
          curl -s -X POST "${{ secrets.RENDER_LIBRECHAT_DEPLOY_HOOK }}"
          echo "✅ LibreChat deploy triggered successfully!"

      - name: Trigger Render Deploy Hook for LiteLLM Proxy
        if: ${{ secrets.RENDER_LITELLM_DEPLOY_HOOK != '' }}
        run: |
          echo "🚀 Triggering LiteLLM Proxy Render Deploy Hook..."
          curl -s -X POST "${{ secrets.RENDER_LITELLM_DEPLOY_HOOK }}"
          echo "✅ LiteLLM Proxy deploy triggered successfully!"
